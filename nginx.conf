server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # TLS terminates at traefik, so keep directory redirects (/en -> /en/) relative
    # instead of letting nginx build an http:// URL.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
